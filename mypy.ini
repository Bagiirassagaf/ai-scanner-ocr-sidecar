[mypy]

# AUDIT FIX (L-06, 2026-08-26): this project had no mypy config at all
# before this. paddleocr ships no type stubs/py.typed marker;
# ignore_missing_imports is the standard mypy-recommended way to silence
# the "no stubs for X" notice for the import itself -- it does NOT
# suppress type errors in *our* code.
[mypy-paddleocr.*]
ignore_missing_imports = True
